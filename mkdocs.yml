  - 终端 UI: part2_terminal_ui.md
  - 统一编译入口: part5_compiler.md
  - 服务与任务: part5_enterprise.md
- 迁移与验证:
  - 迁移到 2.4: migration_24.md
  - 可验证示例: examples.md
  - 实践指南: part6_best_practices.md
  - 故障排查: troubleshooting.md
  - 错误索引: error_index.md
  - 能力与证据: capability_inventory.md
- 项目:
  - 架构演进: part5_architecture_evolution.md
  - 后续方向: part4_future.md
  - 贡献指南: contribution.md
  - 项目与社区: part7_community.md
  - 历史笔记: tmp.md
