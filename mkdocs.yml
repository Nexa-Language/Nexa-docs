site_name: Nexa Docs
site_description: Agent 原生语言与运行时 · 2.4 开发文档
site_url: https://docs.nexa-lang.com/
repo_url: https://github.com/Nexa-Language/Nexa-docs
repo_name: Nexa-Language/Nexa-docs
edit_uri: edit/main/docs/
strict: true
theme:
  name: material
  custom_dir: docs/overrides
  logo: img/nexa-logo-noframe.png
  favicon: img/nexa-logo.png
  font: false
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  features:
  - navigation.top
  - navigation.indexes
  - navigation.footer
  - navigation.tracking
  - search.suggest
  - search.highlight
  - content.code.copy
  - toc.follow
plugins:
- i18n:
    docs_structure: suffix
    fallback_to_default: true
    languages:
    - locale: zh
      name: 简体中文
      default: true
      site_name: Nexa 文档
    - locale: en
      name: English
      site_name: Nexa Docs
      nav_translations:
        开始使用: Start here
        语言: Language
        运行时: Runtime
        工具链: Toolchain
        迁移与验证: Migration and validation
        项目: Project
        概览: Overview
        快速入门: Quickstart
        为什么使用 Nexa: Why Nexa
        设计背景: Design background
        典型场景: Scenarios
        基础语法: Language basics
        语言与 API 参考: Language and API reference
        工具与 Protocol: Tools and Protocols
        管道与并行: Pipelines and parallelism
        Harness 原语: Harness primitives
        结构化上下文: Structured context
        模式匹配: Pattern matching
        ADT: Algebraic data types
        错误处理: Error handling
        模型协议: Provider protocols
        执行与预算: Execution and budgets
        审批与恢复: Approval and resume
        Checkpoint: Checkpoints
        连续对话: Conversation turns
        Artifact: Artifacts
        Actor 生命周期: Actor lifecycle
        Actor 语法: Actor syntax
        Rust 与 WASM: Rust and WASM
        开发工具: Developer tools
        CLI 参考: CLI reference
        配置管理: Configuration
        标准库与 MCP: Standard library and MCP
        标准库 API: Standard library API
        终端 UI: Terminal UI
        统一编译入口: Unified compiler
        服务与任务: Services and tasks
        迁移到 2.4: Migrate to 2.4
        可验证示例: Verified examples
        实践指南: Practical guidance
        故障排查: Troubleshooting
        错误索引: Error index
        能力与证据: Capabilities and evidence
        架构演进: Architecture evolution
        后续方向: Future directions
        贡献指南: Contributing
        项目与社区: Projects and community
        历史笔记: Historical notes
- search
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.highlight
- pymdownx.superfences
- pymdownx.inlinehilite
extra_css:
- stylesheets/fonts.css
- stylesheets/extra.css
extra:
  generator: false
exclude_docs: 'overrides/

  '
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
nav:
- 开始使用:
  - 概览: index.md
  - 快速入门: quickstart.md
  - 为什么使用 Nexa: preface.md
  - 设计背景: preface_background.md
  - 典型场景: preface_scenarios.md
- 语言:
  - 基础语法: part1_basic.md
  - 语言与 API 参考: reference.md
  - 工具与 Protocol: part3_extensions.md
  - 管道与并行: part2_advanced.md
  - Harness 原语: part2_harness.md
  - 结构化上下文: part2_context_structure.md
  - 模式匹配: part2_pattern_matching.md
  - ADT: part2_adt.md
  - 错误处理: part2_error_handling.md
- 运行时:
  - 模型协议: runtime_providers.md
  - 执行与预算: runtime_execution.md
  - 审批与恢复: runtime_approval.md
  - Checkpoint: runtime_checkpoints.md
  - 连续对话: runtime_conversations.md
  - Artifact: runtime_artifacts.md
  - Actor 生命周期: runtime_actors.md
  - Actor 语法: part2_actor.md
  - Rust 与 WASM: runtime_rust.md
- 工具链:
  - 开发工具: toolchain.md
  - CLI 参考: cli_reference.md
  - 配置管理: part2_config_stdlib.md
  - 标准库与 MCP: part4_ecosystem_and_stdlib.md
