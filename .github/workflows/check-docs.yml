name: Check documentation

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  structure-and-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --no-sync python -m scripts.verify

  runtime-examples:
    runs-on: ubuntu-latest
    env:
      RUNTIME_REF: c2162637236e4a73feea410c4183672411666521
    steps:
      - name: Validate the pinned runtime baseline
        shell: bash
        run: |
          if [[ ! "$RUNTIME_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Pin RUNTIME_REF to the reviewed Nexa commit SHA matching docs/inventory.json."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Nexa-Language/Nexa
          ref: ${{ env.RUNTIME_REF }}
          path: .runtime
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv sync --locked --project .runtime
      - run: uv run --no-sync python -m scripts.check_docs --runtime .runtime
