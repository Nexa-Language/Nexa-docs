[project]
name = "nexa-docs"
version = "3.0.0.dev0"
description = "Source-checked bilingual documentation for the Nexa development runtime"
requires-python = ">=3.11"
dependencies = [
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.6,<10",
  "mkdocs-static-i18n>=1.3,<2",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.17,<0.18", "isort>=8,<10", "ty>=0.0.90,<0.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.isort]
profile = "black"
line_length = 160

[tool.ty.environment]
python-version = "3.11"
